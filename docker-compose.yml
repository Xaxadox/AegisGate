version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: aegisgate_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fraud_db
      MYSQL_USER: api_user
      MYSQL_PASSWORD: api_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: aegisgate_redis
    ports:
      - "6379:6379"

volumes:
  mysql_data:
